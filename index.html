<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多使用者雲端未來購物追蹤器</title>
  
  <!-- Firebase SDK (v10.x 模組版) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ⚠️ 貼上你的 Firebase 專案設定值
    const firebaseConfig = {
      apiKey: "pC3hILYo4Pe1p5lPG10q6DybhkaqaEI4T8Z6m7DX",
      authDomain: "1:927572824346:web:12e572d3d64728ac271ca3.firebaseapp.com",
      databaseURL: "https://1:927572824346:web:12e572d3d64728ac271ca3-default-rtdb.firebaseio.com",
      projectId: "1:927572824346:web:12e572d3d64728ac271ca3",
      storageBucket: "1:927572824346:web:12e572d3d64728ac271ca3.appspot.com",
      messagingSenderId: "1:927572824346:web:12e572d3d64728ac271ca3",
      appId: "1:927572824346:web:12e572d3d64728ac271ca3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    window.firebaseApp = { auth, db, provider, signInWithPopup, signOut, onAuthStateChanged, ref, set, onValue };
  </script>

  <style>
    :root {
      --primary: #2563eb; --primary-hover: #1d4ed8;
      --bg: #f8fafc; --card-bg: #ffffff;
      --text: #0f172a; --text-muted: #64748b;
      --border: #e2e8f0; --success: #10b981; --success-bg: #ecfdf5;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border); }
    .auth-card { text-align: center; display: flex; justify-content: space-between; align-items: center; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; }
    .dashboard { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; border: none; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .stat-card { background: rgba(255, 255, 255, 0.08); padding: 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-size: 13px; color: var(--text-muted); }
    input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; } .row .form-group { flex: 1; }
    button { padding: 10px 16px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .item-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; gap: 16px; align-items: center; position: relative; }
    .item-card.completed { border-color: #a7f3d0; background-color: var(--success-bg); }
    .item-img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
    .item-info { flex-grow: 1; }
    .delete-btn { background: none; border: none; color: #ef4444; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- 帳號登入狀態卡片 -->
  <div class="card auth-card">
    <div id="userInfo" class="user-info">
      <span style="color: var(--text-muted); font-size: 14px;">未登入（請登入以儲存專屬資料）</span>
    </div>
    <div id="authBtnGroup">
      <button onclick="loginGoogle()">🔑 Google 登入</button>
    </div>
  </div>

  <!-- 數據統計看板 -->
  <div class="card dashboard">
    <h3 style="margin: 0; color: #fff;">📊 個人財務總覽與還清進度</h3>
    <div class="stats-grid">
      <div class="stat-card" style="grid-column: span 2;">
        <div style="font-size: 12px; color: #94a3b8;">個人追蹤總金額</div>
        <div id="totalExpense" style="font-size: 22px; font-weight: bold; color: #fff;">NT$ 0</div>
      </div>
      <div class="stat-card">
        <div style="font-size: 12px; color: #94a3b8;">每日預估薪資</div>
        <div id="dailySalaryText" style="font-size: 16px; font-weight: bold; color: #fff;">NT$ 0</div>
      </div>
      <div class="stat-card">
        <div style="font-size: 12px; color: #94a3b8;">每日平均攤提</div>
        <div id="dailyAmortizationText" style="font-size: 16px; font-weight: bold; color: #fbbf24;">NT$ 0</div>
      </div>
    </div>
  </div>

  <!-- 個人月薪設定 -->
  <div class="card">
    <div class="form-group">
      <label for="monthlySalary">個人預估月薪 (NT$)</label>
      <input type="number" id="monthlySalary" placeholder="例如：45000" oninput="onSalaryChange()">
    </div>
  </div>

  <!-- 新增購物項目 -->
  <div class="card">
    <h3>➕ 新增購物項目</h3>
    <div class="form-group">
      <label for="itemName">商品名稱</label>
      <input type="text" id="itemName" placeholder="例如：iPhone 16 Pro">
    </div>
    <div class="row">
      <div class="form-group">
        <label for="itemPrice">商品價格 (NT$)</label>
        <input type="number" id="itemPrice" placeholder="36000">
      </div>
      <div class="form-group">
        <label for="itemCategory">分類</label>
        <select id="itemCategory">
          <option value="數碼 3C">數碼 3C</option>
          <option value="服飾配件">服飾配件</option>
          <option value="家電家居">家電家居</option>
          <option value="娛樂旅遊">娛樂旅遊</option>
          <option value="其他">其他</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="form-group">
        <label for="buyDate">購買/預計日期</label>
        <input type="date" id="buyDate">
      </div>
      <div class="form-group">
        <label for="itemImage">商品照片</label>
        <input type="file" id="itemImage" accept="image/*">
      </div>
    </div>
    <button style="width: 100%;" onclick="addItem()">新增至我的追蹤清單</button>
  </div>

  <!-- 購物清單 -->
  <div>
    <h3>📋 我的購物清單</h3>
    <div id="itemList"></div>
  </div>

</div>

<script>
  let currentUser = null;
  let appState = { monthlySalary: 45000, items: [] };

  document.getElementById('buyDate').valueAsDate = new Date();

  // 監聽登入狀態與同步資料
  window.addEventListener('load', () => {
    const timer = setInterval(() => {
      if (window.firebaseApp) {
        clearInterval(timer);
        const { auth, onAuthStateChanged } = window.firebaseApp;
        
        onAuthStateChanged(auth, (user) => {
          currentUser = user;
          if (user) {
            document.getElementById('userInfo').innerHTML = `
              <img src="${user.photoURL}" class="user-avatar" alt="Avatar">
              <span style="font-weight: 600; font-size: 14px;">${user.displayName}</span>
            `;
            document.getElementById('authBtnGroup').innerHTML = `<button class="btn-outline" onclick="logoutGoogle()">登出</button>`;
            listenUserData(user.uid);
          } else {
            document.getElementById('userInfo').innerHTML = `<span style="color: var(--text-muted); font-size: 14px;">未登入（登入以同步自己的雲端資料）</span>`;
            document.getElementById('authBtnGroup').innerHTML = `<button onclick="loginGoogle()">🔑 Google 登入</button>`;
            appState = { monthlySalary: 45000, items: [] };
            renderUI();
          }
        });
      }
    }, 200);
  });

  function loginGoogle() {
    const { auth, provider, signInWithPopup } = window.firebaseApp;
    signInWithPopup(auth, provider).catch(err => alert('登入失敗: ' + err.message));
  }

  function logoutGoogle() {
    const { auth, signOut } = window.firebaseApp;
    signOut(auth);
  }

  function listenUserData(uid) {
    const { db, ref, onValue } = window.firebaseApp;
    const userRef = ref(db, 'users/' + uid);
    onValue(userRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        appState.monthlySalary = data.monthlySalary || 45000;
        appState.items = data.items || [];
      } else {
        appState = { monthlySalary: 45000, items: [] };
      }
      document.getElementById('monthlySalary').value = appState.monthlySalary;
      renderUI();
    });
  }

  function syncToCloud() {
    if (!currentUser) {
      alert('請先點擊上方 Google 登入，才能儲存您的個人資料！');
      return;
    }
    const { db, ref, set } = window.firebaseApp;
    set(ref(db, 'users/' + currentUser.uid), appState);
  }

  function onSalaryChange() {
    appState.monthlySalary = parseFloat(document.getElementById('monthlySalary').value) || 0;
    syncToCloud();
    renderUI();
  }

  function addItem() {
    if (!currentUser) {
      alert('請先點擊頂部 Google 登入，即可開始記錄專屬資料！');
      return;
    }
    const name = document.getElementById('itemName').value;
    const price = parseFloat(document.getElementById('itemPrice').value);
    const category = document.getElementById('itemCategory').value;
    const date = document.getElementById('buyDate').value;
    const imageInput = document.getElementById('itemImage');

    if (!name || !price || price <= 0) return alert('請輸入名稱與價格');

    const file = imageInput.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (e) => saveItemData(name, price, category, date, e.target.result);
      reader.readAsDataURL(file);
    } else {
      saveItemData(name, price, category, date, null);
    }
  }

  function saveItemData(name, price, category, date, imgBase64) {
    appState.items.unshift({ id: Date.now(), name, price, category, date, image: imgBase64 });
    syncToCloud();
    document.getElementById('itemName').value = '';
    document.getElementById('itemPrice').value = '';
    document.getElementById('itemImage').value = '';
  }

  function deleteItem(id) {
    appState.items = appState.items.filter(i => i.id !== id);
    syncToCloud();
  }

  function renderUI() {
    const salary = appState.monthlySalary;
    const listContainer = document.getElementById('itemList');
    listContainer.innerHTML = '';

    const dailySalary = salary > 0 ? (salary / 22) : 0;
    const hourlyRate = dailySalary > 0 ? (dailySalary / 8) : 0;

    let totalExpenseSum = 0;
    let totalDailyAmortization = 0;
    const today = new Date();

    if (appState.items.length === 0) {
      listContainer.innerHTML = '<p style="color: #64748b; text-align: center;">尚無個人追蹤項目。</p>';
    }

    appState.items.forEach(item => {
      totalExpenseSum += item.price;
      const purchaseDate = item.date ? new Date(item.date) : new Date();
      const diffCalendarDays = Math.max(0, Math.floor((today - purchaseDate) / (1000 * 60 * 60 * 24)));
      const passedWorkDays = (diffCalendarDays * (22 / 30));
      const accumulatedEarned = passedWorkDays * dailySalary;
      const isPaidOff = dailySalary > 0 && accumulatedEarned >= item.price;

      const neededHours = hourlyRate > 0 ? (item.price / hourlyRate) : 0;
      const neededDays = neededHours / 8;
      totalDailyAmortization += (item.price / 365);

      let timeStatusHTML = isPaidOff
        ? `<span style="color: #10b981; font-weight: bold;">✓ 已繳清 (工時已償還)</span>`
        : `⏳ 仍需工作 ${neededHours.toFixed(1)} 小時（約 ${Math.max(0, neededDays - passedWorkDays).toFixed(1)} 個工作天還清）`;

      const imgHTML = item.image ? `<img src="${item.image}" class="item-img">` : `<div class="item-img">無圖片</div>`;

      const itemCard = document.createElement('div');
      itemCard.className = `item-card ${isPaidOff ? 'completed' : ''}`;
      itemCard.innerHTML = `
        ${imgHTML}
        <div class="item-info">
          <div style="font-weight: bold;">${item.name} <span style="font-size:12px; font-weight:normal; background:#eff6ff; color:#2563eb; padding:2px 6px; border-radius:10px;">${item.category}</span></div>
          <div style="font-size:12px; color:#64748b;">價格：NT$ ${item.price.toLocaleString()} | 購買日期：${item.date || '未設定'}</div>
          <div style="font-size:13px; margin-top:4px;">${timeStatusHTML}</div>
        </div>
        <button class="delete-btn" onclick="deleteItem(${item.id})">✕</button>
      `;
      listContainer.appendChild(itemCard);
    });

    document.getElementById('totalExpense').innerText = `NT$ ${totalExpenseSum.toLocaleString()}`;
    document.getElementById('dailySalaryText').innerText = `NT$ ${Math.round(dailySalary).toLocaleString()}`;
    document.getElementById('dailyAmortizationText').innerText = `NT$ ${Math.round(totalDailyAmortization).toLocaleString()}`;
  }
</script>

</body>
</html>
